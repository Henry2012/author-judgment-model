<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AJM Concept 打标台</title>
  <style>
    :root {
      color-scheme: light;
      --text: #17191c;
      --muted: #667085;
      --line: #d8dee8;
      --soft: #f5f7fa;
      --surface: #ffffff;
      --accent: #0f62d6;
      --accent-soft: #eaf2ff;
      --ok: #137333;
      --warn: #9a5b00;
      --bad: #b3261e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--surface);
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .wrap {
      width: min(1240px, calc(100vw - 40px));
      margin: 0 auto;
    }

    .topbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button, a.button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    button:hover:not(:disabled), a.button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    main {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: calc(100vh - 77px);
    }

    aside {
      border-right: 1px solid var(--line);
      background: var(--soft);
      padding: 22px;
    }

    .author-list {
      display: grid;
      gap: 12px;
    }

    .author-button {
      width: 100%;
      display: block;
      min-height: auto;
      text-align: left;
      background: var(--surface);
      padding: 14px;
      white-space: normal;
      line-height: 1.35;
      justify-content: initial;
    }

    .author-button[aria-selected="true"] {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .author-button strong {
      display: block;
      margin-bottom: 5px;
      font-size: 16px;
    }

    .author-button span {
      display: block;
      color: var(--muted);
      line-height: 1.45;
      font-size: 13px;
    }

    .panel {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .meta {
      border-bottom: 1px solid var(--line);
      padding: 18px 22px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }

    .meta h2 {
      margin: 0 0 6px;
      font-size: 21px;
      letter-spacing: 0;
    }

    .meta p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-start;
    }

    .chip {
      border-radius: 999px;
      background: #eef3f8;
      color: #28435f;
      padding: 6px 10px;
      font-size: 13px;
      white-space: nowrap;
    }

    .chip.ok { color: var(--ok); background: #e8f5e9; }
    .chip.warn { color: var(--warn); background: #fff4df; }
    .chip.bad { color: var(--bad); background: #fdecec; }

    .review-actions {
      border-bottom: 1px solid var(--line);
      padding: 12px 22px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: #fbfcfe;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .status.ok { color: var(--ok); }
    .status.warn { color: var(--warn); }
    .status.bad { color: var(--bad); }

    .concept-list {
      padding: 18px 22px 32px;
      display: grid;
      gap: 10px;
      align-content: start;
      background: #f9fafc;
    }

    .concept-row {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 12px;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }

    .concept-row.pending {
      border-color: #b8c8dc;
      box-shadow: 0 1px 0 rgba(15, 98, 214, .08);
    }

    .concept-row.accepted {
      border-color: #cfe0d3;
      background: #f7fbf8;
    }

    .concept-row.rejected {
      border-color: #e2d4d2;
      background: #fffafa;
    }

    .concept-row.processed {
      opacity: .56;
    }

    .concept-row input {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      accent-color: var(--accent);
    }

    .concept-title {
      margin: 0 0 6px;
      font-size: 16px;
      line-height: 1.35;
    }

    .concept-title-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .concept-title-line .concept-title {
      margin: 0;
    }

    .state-badge {
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .state-badge.pending { color: var(--accent); background: var(--accent-soft); }
    .state-badge.accepted { color: var(--ok); background: #e8f5e9; }
    .state-badge.rejected { color: var(--bad); background: #fdecec; }

    .concept-summary {
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .concept-meta {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 180px;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 900px) {
      .topbar, .meta {
        display: grid;
        align-items: start;
      }

      .toolbar, .chips {
        justify-content: flex-start;
      }

      main {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .author-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .concept-row {
        grid-template-columns: 28px minmax(0, 1fr);
      }

      .concept-meta {
        grid-column: 2;
        justify-content: flex-start;
      }
    }

    @media (max-width: 560px) {
      .wrap { width: min(100vw - 24px, 1240px); }
      .author-list { grid-template-columns: 1fr; }
      h1 { font-size: 21px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <div>
        <h1>AJM Concept 打标台</h1>
        <p class="subtitle">勾选真实稳定概念，点击提交后勾选项写入 profile.concepts，未勾选项记为 reject。</p>
      </div>
      <div class="toolbar">
        <a class="button" id="openPackage" target="_blank" rel="noreferrer">打开作者问答页</a>
        <a class="button" href="../../README.md" target="_blank" rel="noreferrer">项目说明</a>
      </div>
    </div>
  </header>

  <main>
    <aside>
      <div class="author-list" id="authorList"></div>
    </aside>

    <section class="panel">
      <div class="meta">
        <div>
          <h2 id="authorTitle">加载中</h2>
          <p id="authorDescription">正在读取候选 Concepts。</p>
        </div>
        <div class="chips" id="stats"></div>
      </div>

      <div class="review-actions">
        <div class="toolbar">
          <button type="button" id="selectPass">勾选 Quality Pass</button>
          <button type="button" id="clearAll">清空勾选</button>
          <button type="button" class="primary" id="submitAccept">提交并融合</button>
        </div>
        <div class="status" id="status">等待加载。</div>
      </div>

      <div class="concept-list" id="conceptList"></div>
    </section>
  </main>

  <script>
    const authors = [
      {
        id: "sanshu",
        name: "三叔",
        handle: "sanshu",
        packagePath: "../weibo-2611641261-pruned/package/",
        profilePath: "../weibo-2611641261-pruned/data/profiles/weibo-2611641261/author-judgment-profile.json",
        reviewPath: "../weibo-2611641261-pruned/review/concepts/concept-review-template.json",
        note: "房产、城市、资产配置判断模型"
      },
      {
        id: "jianfang",
        name: "交易者简放",
        handle: "trader-jianfang",
        packagePath: "../weibo-1357064103-pruned/package/",
        profilePath: "../weibo-1357064103-pruned/data/profiles/weibo-1357064103/author-judgment-profile.json",
        reviewPath: "../weibo-1357064103-pruned/review/concepts/concept-review-template.json",
        note: "市场主线、趋势结构、风控与科技产业判断模型"
      },
      {
        id: "tj_research",
        name: "投资TALK君",
        handle: "TJ_Research",
        packagePath: "../x-tj-research-pruned/package/",
        profilePath: "../x-tj-research-pruned/data/profiles/x-1620475218627121153/author-judgment-profile.json",
        reviewPath: "../x-tj-research-pruned/review/concepts/concept-review-template.json",
        note: "美股、AI、宏观、组合风控判断模型"
      }
    ];

    const state = {
      selected: authors[0],
      manifests: new Map(),
      profiles: new Map(),
      reviews: new Map(),
      accepted: new Map()
    };

    const authorList = document.getElementById("authorList");
    const authorTitle = document.getElementById("authorTitle");
    const authorDescription = document.getElementById("authorDescription");
    const stats = document.getElementById("stats");
    const conceptList = document.getElementById("conceptList");
    const statusEl = document.getElementById("status");
    const openPackage = document.getElementById("openPackage");
    const selectPass = document.getElementById("selectPass");
    const clearAll = document.getElementById("clearAll");
    const submitAccept = document.getElementById("submitAccept");

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function setStatus(message, kind = "") {
      statusEl.className = `status ${kind}`.trim();
      statusEl.textContent = message;
    }

    async function loadJson(path) {
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) throw new Error(`${path} ${response.status}`);
      return response.json();
    }

    async function loadManifest(author) {
      if (state.manifests.has(author.id)) return state.manifests.get(author.id);
      const manifest = await loadJson(`${author.packagePath}manifest.json`);
      state.manifests.set(author.id, manifest);
      return manifest;
    }

    async function loadProfile(author) {
      if (state.profiles.has(author.id)) return state.profiles.get(author.id);
      const profile = await loadJson(author.profilePath);
      state.profiles.set(author.id, profile);
      return profile;
    }

    async function loadReview(author) {
      if (state.reviews.has(author.id)) return state.reviews.get(author.id);
      const review = await loadJson(author.reviewPath);
      state.reviews.set(author.id, review);
      return review;
    }

    function selectedSet() {
      if (!state.accepted.has(state.selected.id)) state.accepted.set(state.selected.id, new Set());
      return state.accepted.get(state.selected.id);
    }

    function renderAuthorList() {
      authorList.innerHTML = authors.map((author) => `
        <button class="author-button" type="button" data-author="${escapeHtml(author.id)}" aria-selected="${author.id === state.selected.id}">
          <strong>${escapeHtml(author.name)}</strong>
          <span>${escapeHtml(author.note)}</span>
        </button>
      `).join("");

      authorList.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          const next = authors.find((author) => author.id === button.dataset.author);
          if (next) selectAuthor(next);
        });
      });
    }

    function qualityChip(concept) {
      const status = concept.quality && concept.quality.status;
      const support = concept.quality && concept.quality.support_count;
      if (status === "pass") return `<span class="chip ok">pass · ${escapeHtml(support)}</span>`;
      return `<span class="chip bad">fail · ${escapeHtml(support || 0)}</span>`;
    }

    function conceptState(concept, profile) {
      if (concept.review_decision === "accept") return "accepted";
      if (concept.review_decision === "reject") return "rejected";
      const profileIds = new Set(((profile && profile.concepts) || []).map((item) => item.id));
      return profileIds.has(concept.id) ? "accepted" : "pending";
    }

    function initializeAccepted(author, review, profile) {
      const accepted = new Set();
      for (const concept of review.concepts || []) {
        if (conceptState(concept, profile) === "accepted") accepted.add(concept.id);
      }
      state.accepted.set(author.id, accepted);
    }

    function renderMeta(author, manifest, review, profile) {
      const counts = manifest.counts || {};
      const concepts = review.concepts || [];
      const acceptedCount = selectedSet().size;
      const rejectedCount = concepts.filter((item) => conceptState(item, profile) === "rejected").length;
      const pendingCount = concepts.filter((item) => conceptState(item, profile) === "pending").length;
      const passCount = concepts.filter((item) => item.quality && item.quality.status === "pass").length;
      authorTitle.textContent = author.name;
      authorDescription.textContent = author.note;
      stats.innerHTML = [
        ["候选", concepts.length, ""],
        ["待处理", pendingCount, pendingCount ? "warn" : "ok"],
        ["Quality Pass", passCount, "ok"],
        ["Accepted", acceptedCount, acceptedCount ? "ok" : ""],
        ["Rejected", rejectedCount, rejectedCount ? "bad" : ""],
        ["已入库", counts.concepts || 0, ""]
      ].map(([label, value, kind]) => `<span class="chip ${kind}">${escapeHtml(label)}：${escapeHtml(value)}</span>`).join("");
    }

    function conceptText(concept) {
      const triggers = (concept.trigger_conditions || []).slice(0, 2).join("；");
      const boundaries = (concept.boundary_conditions || []).slice(0, 2).join("；");
      const aliases = (concept.aliases || []).slice(0, 6).join("、");
      return [
        aliases ? `别名：${aliases}` : "",
        triggers ? `触发：${triggers}` : "",
        boundaries ? `边界：${boundaries}` : ""
      ].filter(Boolean).join(" ｜ ");
    }

    function stateLabel(status) {
      return {
        pending: "未处理",
        accepted: "Accepted",
        rejected: "Rejected"
      }[status] || "未处理";
    }

    function renderConcepts(review) {
      const concepts = review.concepts || [];
      const profile = state.profiles.get(state.selected.id) || {};
      if (!concepts.length) {
        conceptList.innerHTML = "<div class=\"empty\">没有可打标的候选 Concepts。</div>";
        return;
      }
      const accepted = selectedSet();
      const sortedConcepts = concepts.slice().sort((a, b) => {
        const rank = { pending: 0, accepted: 1, rejected: 2 };
        return rank[conceptState(a, profile)] - rank[conceptState(b, profile)];
      });
      conceptList.innerHTML = sortedConcepts.map((concept) => {
        const status = conceptState(concept, profile);
        const processed = status !== "pending";
        const checked = accepted.has(concept.id);
        return `
          <label class="concept-row ${escapeHtml(status)} ${processed ? "processed" : ""}" data-concept="${escapeHtml(concept.id)}" data-state="${escapeHtml(status)}">
            <input type="checkbox" ${checked ? "checked" : ""} ${processed ? "disabled" : ""} aria-label="accept ${escapeHtml(concept.name)}">
            <div>
              <div class="concept-title-line">
                <h3 class="concept-title">${escapeHtml(concept.name || concept.id)}</h3>
                <span class="state-badge ${escapeHtml(status)}">${escapeHtml(stateLabel(status))}</span>
              </div>
              <div class="concept-summary">${escapeHtml(conceptText(concept))}</div>
            </div>
            <div class="concept-meta">
              ${qualityChip(concept)}
              <span class="chip">${escapeHtml(concept.discovery_source || "unknown")}</span>
              <span class="chip">${escapeHtml((concept.domains || []).join(" / ") || "no-domain")}</span>
            </div>
          </label>
        `;
      }).join("");

      conceptList.querySelectorAll(".concept-row").forEach((row) => {
        const checkbox = row.querySelector("input");
        checkbox.addEventListener("change", () => {
          if (row.dataset.state !== "pending") return;
          if (checkbox.checked) accepted.add(row.dataset.concept);
          else accepted.delete(row.dataset.concept);
          row.classList.toggle("accepted", checkbox.checked);
          renderMeta(state.selected, state.manifests.get(state.selected.id), state.reviews.get(state.selected.id), state.profiles.get(state.selected.id));
        });
      });
    }

    async function selectAuthor(author) {
      state.selected = author;
      renderAuthorList();
      openPackage.href = `${author.packagePath}index.html`;
      authorTitle.textContent = author.name;
      authorDescription.textContent = "正在读取候选 Concepts。";
      stats.innerHTML = "";
      conceptList.innerHTML = "<div class=\"empty\">加载中。</div>";
      setStatus("正在加载。");

      try {
        const [manifest, profile, review] = await Promise.all([loadManifest(author), loadProfile(author), loadReview(author)]);
        initializeAccepted(author, review, profile);
        renderMeta(author, manifest, review, profile);
        renderConcepts(review);
        setStatus("已加载。勾选后提交；未勾选项会记为 reject。", "ok");
      } catch (error) {
        conceptList.innerHTML = `<div class="empty">${escapeHtml(error.message || error)}</div>`;
        setStatus("加载失败。", "bad");
      }
    }

    selectPass.addEventListener("click", () => {
      const review = state.reviews.get(state.selected.id);
      if (!review) return;
      const profile = state.profiles.get(state.selected.id);
      const accepted = selectedSet();
      (review.concepts || []).forEach((concept) => {
        if (conceptState(concept, profile) === "pending" && concept.quality && concept.quality.status === "pass") accepted.add(concept.id);
      });
      renderMeta(state.selected, state.manifests.get(state.selected.id), review, profile);
      renderConcepts(review);
    });

    clearAll.addEventListener("click", () => {
      const review = state.reviews.get(state.selected.id);
      const profile = state.profiles.get(state.selected.id);
      const accepted = selectedSet();
      (review.concepts || []).forEach((concept) => {
        if (conceptState(concept, profile) === "pending") accepted.delete(concept.id);
      });
      renderMeta(state.selected, state.manifests.get(state.selected.id), review, profile);
      renderConcepts(review);
    });

    submitAccept.addEventListener("click", async () => {
      const acceptedIds = Array.from(selectedSet());
      submitAccept.disabled = true;
      setStatus(`正在提交 ${acceptedIds.length} 个 Concepts。`);
      try {
        const response = await fetch("/api/concepts/apply", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ authorId: state.selected.id, acceptedIds })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "提交失败");
        state.manifests.delete(state.selected.id);
        state.profiles.delete(state.selected.id);
        state.reviews.delete(state.selected.id);
        await selectAuthor(state.selected);
        setStatus(`已融合：${result.profile_concepts} 个 Concepts 已在系统中。`, "ok");
      } catch (error) {
        setStatus(`提交失败：${error.message || error}。请使用 node scripts/concept-review-server.js 启动本地写入服务。`, "bad");
      } finally {
        submitAccept.disabled = false;
      }
    });

    fetch("/api/health", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error("not writable");
      })
      .catch(() => {
        setStatus("当前可能是静态 http.server；提交需要运行 node scripts/concept-review-server.js。", "warn");
      });

    renderAuthorList();
    selectAuthor(state.selected);
  </script>
</body>
</html>
